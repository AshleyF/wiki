<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
    <meta name="description" content="Practice JP Bouvet's triplet vocabulary or randomized phrases built from every possible triplet cell.">
    <title>Triplet Vocabulary Trainer</title>
    <script>
      (() => {
        let theme = 'dark';
        try { theme = localStorage.getItem('personal-wiki-theme') === 'light' ? 'light' : 'dark'; } catch (error) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="stylesheet" href="../../styles.css?v=20260908-shared-triplet-renderer">
    <link rel="stylesheet" href="styles.css?v=20260910-compact-pattern-row-2">
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
  </head>
  <body>
    <header class="app-header">
      <h1>Triplet Vocabulary Trainer</h1>
      <div class="header-actions" aria-label="Display options">
        <label class="view-option" title="Show the triplet count beneath each printed note"><input id="show-counting" type="checkbox"> <span>Count</span></label>
        <label class="view-option" title="Highlight each written note or rest as it plays"><input id="follow-highlighting" type="checkbox" checked> <span>Follow</span></label>
        <label class="view-option" title="Play a four-beat count-in and a 4/4 pedal-hi-hat metronome, with the downbeat accented"><input id="metronome" type="checkbox"> <span>Metronome</span></label>
        <label class="view-option" title="Ignore incoming kick and pedal-hi-hat MIDI notes when scoring"><input id="ignore-feet" type="checkbox" checked> <span>Ignore feet</span></label>
        <label class="view-option" title="Ignore incoming MIDI velocities below the midpoint between the Ghost and Normal velocity handles"><input id="ignore-ghosts" type="checkbox" checked> <span>Ignore ghosts</span></label>
        <label class="header-tempo drum-tempo-control">
          <span>Tempo</span>
          <button class="tempo-step drum-tempo-step" type="button" data-tempo-step="-5" aria-label="Decrease tempo by 5">−</button>
          <input id="tempo" class="drum-tempo" type="number" min="20" max="400" step="1" value="100" aria-label="Playback tempo">
          <button class="tempo-step drum-tempo-step" type="button" data-tempo-step="5" aria-label="Increase tempo by 5">+</button>
        </label>
        <button id="theme-toggle" class="icon-button" type="button" aria-label="Switch theme" title="Switch theme">☀</button>
      </div>
    </header>
    <main>
      <section class="melody-filter panel" aria-label="Melodies available to the trainer">
        <label class="mode-control"><span>Mode</span><select id="trainer-mode" aria-label="Trainer mode"><option value="vocabulary">Vocabulary</option><option value="extended">Extended</option><option value="triplets">Triplets</option></select></label>
        <span class="melody-filter-label">Melodies</span>
        <div id="melody-filter-options" class="melody-filter-options" role="group" aria-label="Enabled triplet melodies"></div>
        <label class="emphasis-control" title="Give this pattern a 50% chance on each eligible shuffle"><span>Emphasize</span><select id="emphasis" aria-label="Emphasized pattern"><option value="">None</option></select></label>
      </section>
      <section class="controls drum-controls panel" aria-label="Trainer controls">
        <button id="play" class="drum-toggle" type="button">▶ Play</button>
        <button id="randomize" type="button">Shuffle</button>
        <label class="auto-control" title="Replace each completed card with a fresh random choice."><input id="auto-randomize" type="checkbox" checked> <span>Auto</span></label>
        <div class="velocity-control drum-velocity-control" role="group" aria-label="Drum velocities" title="Ghost, normal, and accent velocity">
          <span>Vel</span>
          <span class="velocity-track drum-velocity-track">
            <span class="velocity-rail drum-velocity-rail" aria-hidden="true"></span>
            <input class="velocity velocity-ghost drum-velocity drum-velocity-ghost" data-velocity-role="ghost" type="range" min="1" max="127" step="1" value="16" aria-label="Ghost-note velocity" title="Ghost: 16">
            <input class="velocity velocity-normal drum-velocity drum-velocity-normal" data-velocity-role="normal" type="range" min="1" max="127" step="1" value="64" aria-label="Normal-note velocity" title="Normal: 64">
            <input class="velocity velocity-accent drum-velocity drum-velocity-accent" data-velocity-role="accent" type="range" min="1" max="127" step="1" value="111" aria-label="Accent velocity" title="Accent: 111">
          </span>
        </div>
        <label class="sound-control drum-kit-control"><span>Sound</span><select id="sound" class="drum-kit-select" aria-label="Snare or practice-pad sound" disabled><option value="">Loading…</option></select></label>
        <label class="midi-port-control"><span class="midi-input-label"><i id="midi-activity" class="midi-activity" aria-hidden="true"></i>MIDI In</span><select id="midi-input" class="drum-midi-output" aria-label="MIDI input"><option value="">None</option></select></label>
        <label class="midi-port-control"><span>Out</span><select id="midi-output" class="drum-midi-output" aria-label="MIDI output"><option value="">None</option></select></label>
        <span id="status" class="status drum-midi-status" role="status" aria-live="polite"></span>
      </section>
      <section class="phrase" aria-label="Rolling triplet phrase">
        <article class="melody-card panel" data-slot="0"><header><label><span class="card-kind">Melody</span> <select class="card-pattern-first" aria-label="First melody"></select></label><label class="extended-second"><select class="card-pattern-second" aria-label="Second half of bar 1"></select></label></header><div class="notation drum-render"></div></article>
        <article class="melody-card panel" data-slot="1"><header><label><span class="card-kind">Melody</span> <select class="card-pattern-first" aria-label="Second melody"></select></label><label class="extended-second"><select class="card-pattern-second" aria-label="Second half of bar 2"></select></label></header><div class="notation drum-render"></div></article>
        <article class="melody-card panel" data-slot="2"><header><label><span class="card-kind">Melody</span> <select class="card-pattern-first" aria-label="Third melody"></select></label><label class="extended-second"><select class="card-pattern-second" aria-label="Second half of bar 3"></select></label></header><div class="notation drum-render"></div></article>
      </section>
      <section id="practice-pad" class="practice-pad panel" role="region" aria-label="Practice score and secondary transport">
        <div class="practice-score-row">
          <div class="practice-stats" aria-label="Practice score">
            <span><strong id="score-accuracy">—</strong><small>Accuracy</small></span>
            <span><strong id="score-streak">0</strong><small>Streak</small></span>
            <span><strong id="score-best">0</strong><small>Best</small></span>
            <span><strong id="score-hits">0</strong><small>Hits</small></span>
            <span><strong id="score-misses">0</strong><small>Misses</small></span>
          </div>
          <button id="play-compact" class="compact-transport" type="button" aria-label="Play" title="Play">▶</button>
        </div>
        <div id="dedicated-tap-pad" class="dedicated-tap-pad" role="button" aria-label="Rhythm tap area" aria-hidden="true"></div>
      </section>
    </main>
    <script type="module" src="app.js?v=20260911-wake-lock-1"></script>
  </body>
</html>
