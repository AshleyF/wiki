<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Endless piano note flashcards using letters, grand-staff notation, or ear training, with on-screen and MIDI keyboards.">
    <title>Piano Flashcards</title>
    <script>
      (() => {
        let theme = 'dark';
        try { theme = localStorage.getItem('personal-wiki-theme') === 'light' ? 'light' : 'dark'; } catch (error) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="stylesheet" href="styles.css?v=20260911-combined-prompts-3">
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
  </head>
  <body>
    <header class="project-header">
      <h1>Piano Flashcards</h1>
      <button id="theme-toggle" class="icon-button" type="button" aria-label="Switch to light mode" title="Switch to light mode">☀</button>
    </header>

    <main>
      <section class="toolbar panel" aria-label="Flashcard controls">
        <div class="mode-switch" role="group" aria-label="Prompt types">
          <button type="button" data-mode="letter" aria-pressed="true" title="Show the note name"><span class="mode-check" aria-hidden="true">✓</span>Letter</button>
          <button type="button" data-mode="staff" aria-pressed="false" title="Show the note on a staff"><span class="mode-check" aria-hidden="true">✓</span>Staff</button>
          <button type="button" data-mode="ear" aria-pressed="false" title="Play the note as an audible prompt"><span class="mode-check" aria-hidden="true">✓</span>Ear</button>
        </div>
        <button id="replay" type="button" hidden title="Play the current ear-training note again">↻ Hear again</button>
        <details class="settings-controls">
          <summary>Notes</summary>
          <div class="settings-menu note-menu">
            <div class="note-picker-toolbar">
              <label><span>Preset</span>
                <select id="note-preset" title="Choose a starting set of notes">
                  <option value="">Custom selection</option>
                <optgroup label="Staffs">
                  <option value="bass">Bass clef only · C2–B3</option>
                  <option value="treble">Treble clef only · C4–C6</option>
                  <option value="grand">Grand staff · C2–C6</option>
                </optgroup>
                <optgroup label="Octaves">
                  <option value="octave1">C1 octave · C1–B1</option>
                  <option value="low">Low octave · C2–B2</option>
                  <option value="lowerMiddle">Bass octave · C3–B3</option>
                  <option value="middle" selected>Middle C octave · C4–B4</option>
                  <option value="upper">High octave · C5–B5</option>
                  <option value="octave6">C6 octave · C6–B6</option>
                  <option value="octave7">C7 octave · C7–B7</option>
                </optgroup>
                <optgroup label="Mixed ranges">
                  <option value="two">Two octaves · C3–C5</option>
                  <option value="piano">Full piano · A0–C8</option>
                </optgroup>
              </select>
              </label>
              <button id="random-four" type="button" title="Focus on four well-spaced notes from the gray practice range">Random 4</button>
              <button id="remove-one" type="button" title="Remove one random note from the active drill">−1</button>
              <button id="add-one" type="button" title="Add one random note from the gray practice range">+1</button>
              <button id="select-all-notes" type="button" title="Activate the entire gray practice range">All</button>
              <button id="reset-notes" type="button" title="Restore the middle-C natural-note range">Reset</button>
              <span id="note-selection-count" class="note-selection-count" title="Active notes out of the full practice range">7 of 7</span>
            </div>
            <div id="note-picker" class="note-picker" role="group" aria-label="Select piano notes"></div>
          </div>
        </details>
        <details class="midi-controls">
          <summary>MIDI</summary>
          <div class="midi-menu">
            <label><span>Input</span><select id="midi-input"><option value="">None</option></select></label>
            <label><span>Output</span><select id="midi-output"><option value="">None</option></select></label>
          </div>
        </details>
      </section>

      <section class="prompt-panel panel" aria-label="Current flashcard">
        <div class="prompt-heading">
          <span id="mode-label">Letter</span>
          <span id="status" role="status" aria-live="polite">Play the matching key.</span>
        </div>
        <div id="prompt" class="prompt">
          <div id="letter-prompt" class="letter-prompt" aria-label="Note letter"></div>
          <div id="staff-prompt" class="staff-prompt" aria-label="Staff notation" hidden></div>
          <div id="ear-prompt" class="ear-prompt" aria-label="Listen for the note" hidden>
            <span aria-hidden="true">♫</span><strong>Listen</strong>
          </div>
        </div>
      </section>

      <section class="stats panel" aria-label="Session statistics">
        <div><span>Correct</span><strong id="correct-count">0</strong></div>
        <div><span>Missed</span><strong id="miss-count">0</strong></div>
        <div><span>Streak</span><strong id="streak-count">0</strong></div>
        <div><span>Accuracy</span><strong id="accuracy">—</strong></div>
        <button id="reset-stats" type="button">Reset</button>
      </section>

      <section class="keyboard-panel panel" aria-label="Piano keyboard">
        <div id="keyboard" class="keyboard" aria-label="On-screen piano keyboard"></div>
      </section>
    </main>

    <script type="module" src="app.js?v=20260911-key-release-1"></script>
  </body>
</html>
